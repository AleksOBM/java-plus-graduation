server:
  port: 8761

spring:
  application:
    name: discovery-server
  output:
    ansi:
      enabled: ALWAYS
  main:
    banner-mode: off
    log-startup-info: false

eureka:
  client:
    webclient:
      enabled: true
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info, mappings

logging:
  level:
    root: info
    org:
      springframework: error
spring:
  sql.init:
    mode: ALWAYS
    schema-locations: classpath:schema-postgres.sql
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ewm-main
    username: dbuser
    password: 12345
  jpa:
    generate-ddl: false
    hibernate.ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
    org:
      zalando:
        logbook: trace

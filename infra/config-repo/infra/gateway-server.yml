spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            wiretap: true
          httpserver:
            wiretap: true
          discovery:
            locator:
              enabled: false
          routes:

            # ==================== ADMIN ====================

            - id: admin-users
              order: 0
              uri: lb://user-service
              predicates:
                - Path=/admin/users/**

            - id: admin-categories
              order: 0
              uri: lb://event-service
              predicates:
                - Path=/admin/categories/**

            - id: admin-compilations
              order: 0
              uri: lb://event-service
              predicates:
                - Path=/admin/compilations/**

            - id: admin-events
              order: 0
              uri: lb://event-service
              predicates:
                - Path=/admin/events/**

            # ==================== USER ====================

            - id: user-ratings
              order: -2
              uri: lb://rating-service
              predicates:
                - Path=/users/{userId}/events/{eventId}/likes/**

            - id: user-events-requests
              order: -1
              uri: lb://event-service
              predicates:
                - Path=/users/{userId}/events/{eventId}/requests/**

            - id: user-events
              order: 0
              uri: lb://event-service
              predicates:
                - Path=/users/{userId}/events/**

            - id: user-requests
              order: 0
              uri: lb://request-service
              predicates:
                - Path=/users/{userId}/requests/**

            # ==================== FREE ====================

            - id: free-events
              order: 0
              uri: lb://event-service
              predicates:
                - Path=/events/**

            - id: free-categories
              order: 0
              uri: lb://event-service
              predicates:
                - Path=/categories/**

            - id: free-compilations
              order: 0
              uri: lb://event-service
              predicates:
                - Path=/compilations/**

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: gateway, health, metrics, prometheus, info, mappings, refresh

syntax = "proto3";

package stats.messages.analyzer;

option java_package = "ru.practicum.ewm.stats.proto";
option java_multiple_files = true;

// Запрос на получение рекомендуемых мероприятий
message UserRecommendationsRequestProto {
  int64 user_id = 1;
  int32 max_results = 2; // Ограничение на количество возвращаемых мероприятий
}

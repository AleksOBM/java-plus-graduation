syntax = "proto3";

package stats.messages.analyzer;

option java_package = "ru.practicum.ewm.stats.proto";
option java_multiple_files = true;

// Запрос на получение рекомендуемых мероприятий
message InteractionsCountRequestProto {

  /**
   * Идентификаторы мероприятий для которых
   * нужно вернуть количество взаимодействий
   */
  repeated int64 event_id = 1;
}

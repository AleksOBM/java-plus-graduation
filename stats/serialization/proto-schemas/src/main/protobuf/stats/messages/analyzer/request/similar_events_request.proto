syntax = "proto3";

package stats.messages.analyzer;

option java_package = "ru.practicum.ewm.stats.proto";
option java_multiple_files = true;

// Запрос на получение похожих мероприятий
message SimilarEventsRequestProto {
  int64 user_id = 1;
  int64 event_id = 2;
  int32 max_results = 3; // Ограничение на количество возвращаемых мероприятий
}

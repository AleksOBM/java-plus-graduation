spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      fail-fast: false
      discovery:
        enabled: false
  application:
    name: stats-server
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ewm-stats
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

eureka:
  client:
    enabled: false

logging:
  level:
    org.springframework.cloud: DEBUG